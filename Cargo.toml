[package]
name = "evmedia"
version = "0.1.0"
edition = "2021"
description = "Cross-platform course-media catalog, download, and verified local conversion core"
license = "MIT"

[dependencies]
aes = "0.8.3"
anyhow = "1.0.75"
clap = { version = "=4.4.11", features = ["derive"] }
ecb = "0.1.2"
encoding_rs = "=0.8.33"
futures-util = "0.3.29"
hex = "0.4.3"
indexmap = "=2.2.6"
md-5 = "0.10.6"
reqwest = { version = "=0.11.22", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "=1.0.193", features = ["derive"] }
serde_json = "=1.0.108"
sha2 = "0.10.8"
tokio = { version = "=1.35.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
url = "=2.5.0"
walkdir = "2.4.0"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.48.0", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Threading"] }
