[package]
name = "evmedia-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop shell for evmedia: every interaction is an evmedia CLI invocation"

[[bin]]
name = "evmedia-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# Deliberately absent: evmedia-core and evmedia-win. The GUI's only model of the product is
# "a set of CLI invocations", and leaving those crates out of this manifest turns that from a
# convention into something the linker enforces.
evmedia-contract.workspace = true
anyhow.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true

[target.'cfg(windows)'.dependencies]
# Job objects, so cancelling takes ffmpeg down with the CLI instead of orphaning it.
windows-sys.workspace = true
