<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>evmedia</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="icon.png" alt="" class="logo" />
        <div>
          <h1>evmedia</h1>
          <p class="tagline">EVPlayer2 课时抓取工具</p>
        </div>
      </div>
      <div id="cli-status" class="chip chip-warn">正在查找 evmedia CLI…</div>
    </header>

    <main>
      <nav class="commands" id="commands"></nav>

      <section class="form-pane">
        <div class="pane-head">
          <h2 id="command-title">选择一个命令</h2>
          <p id="command-about" class="about"></p>
        </div>
        <form id="form" autocomplete="off"></form>

        <div class="preview">
          <div class="preview-head">
            <span>将要执行的命令</span>
            <button type="button" id="copy" class="link">复制</button>
          </div>
          <code id="argv" class="argv"></code>
        </div>

        <div class="actions">
          <button type="button" id="run" class="primary" disabled>运行</button>
          <button type="button" id="cancel" disabled>取消</button>
          <button type="button" id="force" disabled class="danger">强制结束</button>
        </div>
      </section>

      <section class="run-pane">
        <div class="status-strip">
          <div class="stat">
            <span class="label">阶段</span><span id="stat-stage" class="value">—</span>
          </div>
          <div class="stat">
            <span class="label">密钥</span><span id="stat-keys" class="value">0</span>
          </div>
          <div class="stat">
            <span class="label">分片</span><span id="stat-segments" class="value">0</span>
          </div>
          <div class="stat">
            <span class="label">已完成</span><span id="stat-done" class="value">0</span>
          </div>
          <div class="stat">
            <span class="label">失败</span><span id="stat-failed" class="value">0</span>
          </div>
          <div class="stat">
            <span class="label">用时</span><span id="stat-elapsed" class="value">0s</span>
          </div>
        </div>
        <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
        <div id="banner" class="banner hidden"></div>

        <div class="log-head">
          <span>输出（CLI 的 stderr，与终端逐字一致）</span>
          <button type="button" id="clear-log" class="link">清空</button>
        </div>
        <pre id="log" class="log"></pre>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
